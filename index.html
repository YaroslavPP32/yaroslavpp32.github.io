<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 10px; background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); cursor: pointer; }
        #status { margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <h2>Тест геолокации</h2>
    <button id="sendLocationBtn">📍 Отправить местоположение</button>
    <div id="status"></div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        const btn = document.getElementById('sendLocationBtn');
        const statusDiv = document.getElementById('status');

        btn.addEventListener('click', async () => {
            // Проверяем, поддерживается ли LocationManager в этой версии
            if (!tg.LocationManager) {
                statusDiv.innerText = "❌ LocationManager не поддерживается вашей версией Telegram.";
                return;
            }

            statusDiv.innerText = "⏳ Запрашиваем геолокацию...";

            try {
                // Запрашиваем координаты. Появится системное окно разрешения.
                const location = await tg.LocationManager.getLocation();
                
                if (!location) {
                    statusDiv.innerText = "❌ Вы отклонили запрос на геолокацию.";
                    return;
                }

                // Формируем данные для отправки
                const dataToSend = {
                    lat: location.latitude,
                    lon: location.longitude,
                    // Можно добавить и другие поля, например точность
                    accuracy: location.horizontal_accuracy
                };
                statusDiv.innerText = "✅ Координаты получены. Отправляем боту...";

                // Отправляем данные боту. Mini App закроется.
                tg.sendData(JSON.stringify(dataToSend));

            } catch (error) {
                console.error("Ошибка получения геолокации:", error);
                statusDiv.innerText = "❌ Ошибка: " + error.message;
            }
        });
    </script>
</body>
</html>
