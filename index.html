<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        button { padding: 15px 30px; font-size: 18px; border: none; border-radius: 10px; background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); cursor: pointer; }
        #status { margin-top: 20px; text-align: center; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Тест геолокации</h2>
    <button id="sendLocationBtn">📍 Отправить местоположение</button>
    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const btn = document.getElementById('sendLocationBtn');
        const statusDiv = document.getElementById('status');

        // Вспомогательная функция для инициализации с повторными попытками
        function initLocationManager(maxAttempts = 3) {
            return new Promise((resolve, reject) => {
                let attempts = 0;

                function attempt() {
                    attempts++;
                    if (tg.LocationManager.isInited) {
                        resolve();
                        return;
                    }

                    try {
                        // init() может принимать колбэк
                        tg.LocationManager.init(() => {
                            if (tg.LocationManager.isInited) {
                                resolve();
                            } else if (attempts < maxAttempts) {
                                // Если не инициализировался, пробуем ещё раз чуть позже
                                setTimeout(attempt, 50);
                            } else {
                                reject(new Error('LocationManager не инициализировался после нескольких попыток'));
                            }
                        });
                    } catch (err) {
                        // Если init() выбросил ошибку синхронно
                        if (attempts < maxAttempts) {
                            setTimeout(attempt, 50);
                        } else {
                            reject(err);
                        }
                    }
                }

                attempt();
            });
        }

        btn.addEventListener('click', async () => {
            btn.disabled = true;

            // 1. Проверка поддержки
            if (!tg.LocationManager) {
                statusDiv.innerText = "❌ LocationManager не поддерживается вашей версией Telegram.";
                btn.disabled = false;
                return;
            }

            // 2. Инициализация через init()
            if (!tg.LocationManager.isInited) {
                statusDiv.innerText = "⏳ Инициализация геолокации...";
                try {
                    await initLocationManager();
                } catch (initError) {
                    console.error("Ошибка инициализации:", initError);
                    statusDiv.innerText = "❌ Не удалось инициализировать геолокацию: " + initError.message;
                    btn.disabled = false;
                    return;
                }
            }

            // 3. Запрос координат
            statusDiv.innerText = "⏳ Запрашиваем геолокацию...";
            try {
                // getLocation() в стандартном API работает через колбэк
                const location = await new Promise((resolve) => {
                    tg.LocationManager.getLocation((locationData) => {
                        resolve(locationData);
                    });
                });

                if (!location) {
                    statusDiv.innerText = "❌ Вы отклонили запрос на геолокацию.";
                    btn.disabled = false;
                    return;
                }

                statusDiv.innerText = "✅ Координаты получены. Отправляем боту...";

                const dataToSend = {
                    lat: location.latitude,
                    lon: location.longitude,
                    accuracy: location.horizontal_accuracy
                };

                // Отправляем данные и закрываем Mini App
                tg.sendData(JSON.stringify(dataToSend));

            } catch (error) {
                console.error("Ошибка получения геолокации:", error);
                statusDiv.innerText = "❌ Ошибка: " + error.message;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
