<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        .card { background: var(--tg-theme-secondary-bg-color); padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .metric { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(128,128,128,0.2); }
        .metric:last-child { border-bottom: none; }
        .metric-label { opacity: 0.7; }
        .metric-value { font-weight: 600; font-variant-numeric: tabular-nums; }
        button { width: 100%; padding: 15px; font-size: 17px; border: none; border-radius: 10px; background-color: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); cursor: pointer; margin-top: 10px; }
        button:disabled { opacity: 0.5; }
        #status { margin-top: 15px; text-align: center; font-size: 14px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>📍 Live Dashboard</h2>

    <div class="card" id="metricsCard" style="display: none;">
        <div class="metric"><span class="metric-label">Широта</span><span class="metric-value" id="lat">—</span></div>
        <div class="metric"><span class="metric-label">Долгота</span><span class="metric-value" id="lon">—</span></div>
        <div class="metric"><span class="metric-label">Скорость</span><span class="metric-value" id="speed">—</span></div>
        <div class="metric"><span class="metric-label">Направление</span><span class="metric-value" id="course">—</span></div>
        <div class="metric"><span class="metric-label">Высота</span><span class="metric-value" id="altitude">—</span></div>
        <div class="metric"><span class="metric-label">Точность</span><span class="metric-value" id="accuracy">—</span></div>
    </div>

    <button id="startBtn">▶️ Начать отслеживание</button>
    <button id="stopBtn" style="display: none;">⏹️ Остановить</button>
    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let watchInterval = null;
        let locationManagerInited = false;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const metricsCard = document.getElementById('metricsCard');

        // Инициализация LocationManager с повторными попытками
        async function ensureLocationManager() {
            if (!tg.LocationManager) throw new Error('LocationManager недоступен');
            if (locationManagerInited && tg.LocationManager.isInited) return;

            await new Promise((resolve, reject) => {
                let attempts = 0;
                const tryInit = () => {
                    attempts++;
                    if (tg.LocationManager.isInited) { locationManagerInited = true; resolve(); return; }
                    tg.LocationManager.init(() => {
                        if (tg.LocationManager.isInited) { locationManagerInited = true; resolve(); }
                        else if (attempts < 5) setTimeout(tryInit, 100);
                        else reject(new Error('init failed'));
                    });
                };
                tryInit();
            });
        }

        // Запрос координат с обходом Android-бага
        async function fetchLocation() {
            // "Пинок" для Android: параллельный вызов браузерного API
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(() => {}, () => {}, { timeout: 1000 });
            }

            return new Promise((resolve) => {
                tg.LocationManager.getLocation((loc) => resolve(loc));
            });
        }

        function formatSpeed(mps) {
            if (mps === null || mps === undefined) return '—';
            return (mps * 3.6).toFixed(1) + ' км/ч'; // м/с -> км/ч
        }

        function formatCourse(deg) {
            if (deg === null || deg === undefined) return '—';
            const directions = ['С', 'СВ', 'В', 'ЮВ', 'Ю', 'ЮЗ', 'З', 'СЗ'];
            const idx = Math.round(deg / 45) % 8;
            return `${deg.toFixed(0)}° (${directions[idx]})`;
        }

        function updateUI(loc) {
            metricsCard.style.display = 'block';
            document.getElementById('lat').textContent = loc.latitude?.toFixed(6) ?? '—';
            document.getElementById('lon').textContent = loc.longitude?.toFixed(6) ?? '—';
            document.getElementById('speed').textContent = formatSpeed(loc.speed);
            document.getElementById('course').textContent = formatCourse(loc.course);
            document.getElementById('altitude').textContent = loc.altitude != null ? loc.altitude.toFixed(1) + ' м' : '—';
            document.getElementById('accuracy').textContent = loc.horizontal_accuracy != null ? loc.horizontal_accuracy.toFixed(0) + ' м' : '—';
        }

        async function tick() {
            try {
                const loc = await fetchLocation();
                if (loc) updateUI(loc);
                else statusDiv.innerText = '⚠️ Нет данных (проверьте разрешение)';
            } catch (e) {
                statusDiv.innerText = '❌ Ошибка: ' + e.message;
            }
        }

        startBtn.addEventListener('click', async () => {
            startBtn.disabled = true;
            statusDiv.innerText = '⏳ Инициализация...';
            try {
                await ensureLocationManager();
            } catch (e) {
                statusDiv.innerText = '❌ ' + e.message;
                startBtn.disabled = false;
                return;
            }

            statusDiv.innerText = '✅ Отслеживание запущено. Обновление каждую секунду.';
            startBtn.style.display = 'none';
            stopBtn.style.display = 'block';

            tick();
            watchInterval = setInterval(tick, 1000);
        });

        stopBtn.addEventListener('click', () => {
            if (watchInterval) clearInterval(watchInterval);
            watchInterval = null;
            statusDiv.innerText = '⏹️ Отслеживание остановлено.';
            startBtn.style.display = 'block';
            startBtn.disabled = false;
            stopBtn.style.display = 'none';
        });
    </script>
</body>
</html>
